name: "Publish Release"
on:
  push:
    branches: [ main ]

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            # Build for BOTH Intel and Apple Silicon in one single DMG
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Install both targets for Mac so we can make the Universal binary
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Prepare Sidecars and Browsers
        shell: bash
        working-directory: tauri-app 
        run: |
          npm install
          node $GITHUB_WORKSPACE/build-scripts/bundle-engine.js
          
          mkdir -p src-tauri/bin
          if [ "${{ matrix.platform }}" == "windows-latest" ]; then
            cp $(which node) src-tauri/bin/node-x86_64-pc-windows-msvc.exe
          elif [ "${{ matrix.platform }}" == "macos-latest" ]; then
            # Provide both architecture names so the universal build succeeds
            cp $(which node) src-tauri/bin/node-aarch64-apple-darwin
            cp $(which node) src-tauri/bin/node-x86_64-apple-darwin
          else
            cp $(which node) src-tauri/bin/node-x86_64-unknown-linux-gnu
          fi

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app 
          tagName: v__VERSION__
          releaseName: "Automation App v__VERSION__"
          releaseDraft: true
          # Matrix args handles the --target universal-apple-darwin
          args: ${{ matrix.args }}